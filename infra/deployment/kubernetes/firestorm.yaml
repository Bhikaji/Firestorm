# Minimal, hardened Kubernetes reference for FIRESTORM.
#
# Before applying:
#   * create the `firestorm` namespace and a Secret with the real values
#     (never commit secrets to Git);
#   * replace image references with your registry;
#   * terminate TLS at an Ingress with an authentication layer in front.
apiVersion: v1
kind: Namespace
metadata:
  name: firestorm
---
apiVersion: v1
kind: Secret
metadata:
  name: firestorm-secrets
  namespace: firestorm
type: Opaque
stringData:
  FIRESTORM_SECRET_KEY: "replace-with-48-plus-random-bytes"
  FIRESTORM_INGEST_API_KEY: "replace-with-random-sensor-key"
  FIRESTORM_DATABASE_URL: "postgresql+psycopg://firestorm:CHANGE_ME@postgres:5432/firestorm"
  POSTGRES_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: firestorm-config
  namespace: firestorm
data:
  FIRESTORM_APP_ENV: "production"
  FIRESTORM_ALLOWED_HOSTS: "firestorm.example.com"
  FIRESTORM_FORCE_HTTPS: "true"
  FIRESTORM_CORS_ORIGINS: "https://firestorm.example.com"
  FIRESTORM_ENFORCEMENT_MODE: "simulated"
  FIRESTORM_REQUIRE_APPROVAL_FOR_CONTAINMENT: "true"
  FIRESTORM_LOG_JSON: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firestorm-api
  namespace: firestorm
spec:
  replicas: 2
  selector:
    matchLabels: { app: firestorm-api }
  template:
    metadata:
      labels: { app: firestorm-api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: registry.example.com/firestorm-api:0.1.0
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: firestorm-config }
            - secretRef: { name: firestorm-secrets }
          readinessProbe:
            httpGet: { path: /api/v1/ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: evidence, mountPath: /app/evidence }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: evidence
          persistentVolumeClaim: { claimName: firestorm-evidence }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firestorm-evidence
  namespace: firestorm
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests: { storage: 20Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: firestorm-api
  namespace: firestorm
spec:
  selector: { app: firestorm-api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: firestorm-api-ingress
  namespace: firestorm
spec:
  podSelector:
    matchLabels: { app: firestorm-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { name: ingress-nginx } }
      ports: [{ port: 8000, protocol: TCP }]

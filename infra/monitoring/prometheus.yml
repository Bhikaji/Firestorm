global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: firestorm

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: firestorm-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: firestorm-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# FIRESTORM reverse proxy (TLS termination, static frontend, API, WebSocket).
#
# Terminate TLS here. The management console must never be exposed to the
# public internet without an additional access control layer (VPN, Zero Trust
# proxy, or mTLS). See docs/security-model.md.

upstream firestorm_api {
    server api:8000;
    keepalive 32;
}

# Edge rate limiting (must be declared at the http level; conf.d files are
# included there). Application-level limits are configured separately.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 8080;
    server_name _;

    # Security headers. CSP is strict: the SPA ships no inline scripts.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    client_max_body_size 4m;
    server_tokens off;

    # Rate limit at the edge as well as in the application.
    limit_req zone=api_limit burst=40 nodelay;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://firestorm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Live dashboard updates
    location /api/v1/ws/ {
        proxy_pass http://firestorm_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app
      - name: Unit tests
        env:
          FIRESTORM_APP_ENV: test
          FIRESTORM_SECRET_KEY: ci-secret-key-that-is-long-enough-0123456789
          FIRESTORM_DATABASE_URL: sqlite:///./ci-test.db
          FIRESTORM_DEMO_DATA: "false"
          FIRESTORM_INGEST_API_KEY: ci-ingest-key
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=55
      - name: Alembic migration smoke test
        env:
          FIRESTORM_DATABASE_URL: sqlite:///./ci-migrate.db
          FIRESTORM_SECRET_KEY: ci-secret-key-that-is-long-enough-0123456789
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Bootstrap smoke test
        env:
          FIRESTORM_DATABASE_URL: sqlite:///./ci-bootstrap.db
          FIRESTORM_SECRET_KEY: ci-secret-key-that-is-long-enough-0123456789
          FIRESTORM_BOOTSTRAP_ADMIN_PASSWORD: Ci-Bootstrap-Passw0rd!9
          FIRESTORM_DEMO_DATA: "false"
        run: python scripts/bootstrap.py --no-demo

  repository-tests:
    name: Integration, security and performance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run repository tests
        env:
          PYTHONPATH: backend
        run: pytest tests -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: firestorm-frontend
          path: frontend/dist
          retention-days: 7

  containers:
    name: Container build and vulnerability scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t firestorm-api:ci .
      - name: Build web image
        run: docker build -f infra/docker/Dockerfile.web -t firestorm-web:ci .
      - name: Scan API image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: firestorm-api:ci
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-api.sarif

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt || echo "::warning::pip-audit reported findings"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::npm audit reported findings"
